# 配置模板：复制为 config.yaml 后填写自选股与 webhook 变量名。
# 【重要】系数、换手率阈值为官方未公开的推测复刻值，需用同花顺截图对照微调。

general:
  timezone: Asia/Shanghai   # A 股交易时间均按北京时间判断
  log_level: INFO           # DEBUG / INFO / WARNING / ERROR
  dry_run: true             # true = 只打印消息不推送；先跑 1-2 天再改 false

fetch:
  use_westock: true         # 优先本机 westock CLI；失败再降级 akshare / 东财
  westock_cli: ~/.local/bin/westock
  interval_seconds: 0.8     # 串行请求间隔
  retries: 3                # 降级通道最大尝试次数；检测到东财限流立即停止重试
  backoff_seconds: [1, 3, 8]
  history_bars: 120         # 每次取最近 N 根 K 线；westock m60 近 1 个月约 60 根

indicator:
  # 关键：两个系数只有比值 rho = k2/k1 有意义，同比例缩放不改变任何信号。
  # 判据等价于 MA7/MA13 穿越 rho：rho<1 偏多，rho>1 偏空。
  rho: 1.000                  # 默认买入阈值 k2/k1
  rho_sell: 1.000             # 默认卖出阈值；高于 rho 形成死区
  signal_mode: cross          # cross=仅金叉/死叉首点；state=状态切换（含二买二卖）
  rho_by_period:              # 可选：按周期覆盖默认 rho
    m60: 0.994
    daily: 1.000
  rho_sell_by_period:
    m60: 1.000
    daily: 1.000
  hold_rule:                  # 状态机：金叉上方 + 收阳 + 换手达标 -> 黄柱持有
    require_bullish_candle: true
    turnover_threshold_60m: 0.1    # 60 分钟 cross 模式标定值（宁德时代样本）
    turnover_threshold_daily: 0.5  # 日线标定值（%）

periods:
  m60:
    enabled: true
    push: true
  daily:
    enabled: true
    push: true
  use_as_confirm: true      # 60 分钟消息附带日线 BUY/SELL/无 的二次确认标签

dedup:
  merge_cross_period: false # false = 60 分钟与日线分别推送，不去重合并
  key_by_bar_time: true     # 同一根 K 线只处理一次

notify:
  webhook_key_env: WECOM_WEBHOOK_KEY  # 仅变量名；值放 ~/.env，不写入本文件与日志
  max_per_minute: 15        # 企微机器人官方上限 20 条/分钟，留余量

symbols:                    # 多只自选股；代码 6 位字符串
  - code: "300750"
    name: "宁德时代"
  # - code: "600519"
  #   name: "贵州茅台"
