# 波段助手监控 — 实际配置
# 系数与换手率阈值均为推测值，详见 CONTEXT.md / PLAN.md，调参后更新本文件。

general:
  timezone: Asia/Shanghai
  log_level: INFO
  dry_run: true   # 调参期保持 true；确认无误后改为 false 才会真实推送

fetch:
  use_westock: true             # 优先本机 westock CLI，避免东财 push2 限流
  westock_cli: ~/.local/bin/westock
  interval_seconds: 0.8
  retries: 3
  backoff_seconds: [1, 3, 8]
  history_bars: 120

indicator:
  # 官方两个系数只有比值有意义：rho = k2 / k1，是 MA7/MA13 的穿越阈值
  # rho < 1 偏多（金叉提前、死叉滞后）；rho > 1 偏空
  rho: 1.000                    # 默认买入阈值 k2/k1
  rho_sell: 1.000               # 默认卖出阈值；高于 rho 时形成死区，抑制小波动假卖
  signal_mode: cross            # cross=金叉/死叉首点；state=状态切换（含二买）；ma7=收盘 vs 快线 MA7
  signal_mode_by_period:        # 按周期覆盖（2026-11-24 逐根核对后新增）
    m60: ma7                    # 60 分钟改用 ma7：收盘回到/站上 MA7 标买，与同花顺截图逐根对齐
    daily: ma7                  # 日线 2026-11-25 标定后同样切 ma7：MA7/MA13 金叉
                                # 相对真值中位滞后 5~6 根，±1 根口径下不可用
  ma7_lead_pct: 0.0             # ma7 口径买点提前量(%)，2026-11-25 晚改成 0
                                # 原因：改用 signal_shift 把信号整体前移一根后，
                                # 提前量做的事被平移覆盖，两者叠加反而互相干扰
                                # （lead 0.3 + shift → 精度 55.7；lead 0 + shift → 56.5）
  turnover_rel_min: 1.0         # 相对换手门：换手 >= 1.00 × 近 20 根中位，买/卖两侧都卡
                                # 绝对换手门跨标的不可比（宁德 60m 单根 0.07% vs 光线 0.7%）
  signal_shift: -1              # 信号位置整体平移（根）：-1 = 买卖点全部提前一根
                                # 真值同根命中率 6% → 46%，中位偏移 -1 → 0
                                # ⚠ 这是「标注对齐」，不是「更早算出」：实盘/回测用它
                                # 等于提前一根使用未来信息，只用于复盘与同花顺画图对齐
  skip_buy_after_sell: true     # 丢弃「前一根是卖点」的买点（先平移再判断）
                                # 压制震荡区卖完立刻回买的横跳：信号 66→62、精度 56.1→56.5
  rho_by_period:                # 按周期覆盖；删掉某项即用上面的默认 rho
    m60: 0.994                  # 60分钟买入偏早
    daily: 1.000
  rho_sell_by_period:           # 卖出用更高阈值，死叉提前且不易在阈值附近抖动
    m60: 1.000
    daily: 1.000
  hold_rule:                    # 三态过滤：处于金叉上方 + 收阳 + 换手达标 = 黄柱持有
    require_bullish_candle: true
    turnover_threshold_60m: 0.1   # 60 分钟 cross 模式标定值（关闭二买后需降低阈值才能保留买点）
    turnover_threshold_daily: 0.5 # 日线随 rho 一起标定；1.5%~2% 会漏掉多数买点

periods:
  m60:
    enabled: true
    push: true
  daily:
    enabled: true
    push: true
  use_as_confirm: true  # 60 分钟消息附带日线状态标签

dedup:
  merge_cross_period: false   # false = 两个周期严格分别推送
  key_by_bar_time: true

notify:
  webhook_key_env: WECOM_WEBHOOK_KEY  # 只写变量名；真实 key 存 ~/.env，绝不入 git
  max_per_minute: 15

# 自选股清单：把下面的示例替换成你自己的标的
symbols:
  - code: "300750"
    name: "宁德时代"
